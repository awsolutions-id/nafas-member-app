<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KONTROL AKSES NAFAS</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a061a; 
            font-family: 'Montserrat', sans-serif; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow: hidden; 
        }

        .container-box { 
            width: 90%; 
            max-width: 350px; 
            background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 20px; 
            padding: 30px; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h2 { font-family: 'Orbitron', sans-serif; color: #00e5ff; margin-bottom: 20px; font-size: 1.2rem; letter-spacing: 1px; }
        
        .input-style { 
            width: 100%; padding: 12px; margin-bottom: 15px; 
            border-radius: 10px; border: 1px solid #333; 
            background: #000; color: white; outline: none; text-align: center; 
        }

        .btn-main { 
            width: 100%; padding: 14px; border: none; border-radius: 10px; 
            background: linear-gradient(90deg, #8e2de2, #f00073); 
            color: white; font-weight: bold; cursor: pointer; font-family: 'Orbitron';
        }

        .page { display: none; }
        .page.active { display: block; }

        .btn-control { 
            width: 100%; padding: 15px; margin: 10px 0; 
            border: none; border-radius: 10px; color: white; 
            font-weight: bold; cursor: pointer; font-family: 'Orbitron'; 
        }

        .status-display { 
            padding: 15px; margin-bottom: 20px; border-radius: 10px; 
            background: rgba(0,0,0,0.4); font-weight: bold; font-family: 'Orbitron'; font-size: 14px;
        }

        /* --- MODAL NOTIFIKASI SESUAI SCREENSHOT --- */
        #notifOverlay { 
            display: none; position: fixed; inset: 0; 
            background: rgba(0,0,0,0.85); z-index: 9999; 
            justify-content: center; align-items: center; 
            backdrop-filter: blur(5px);
        }
        .notif-card { 
            background: #0a061a; 
            border: 2px solid #00f2fe; 
            padding: 25px; border-radius: 20px; width: 85%; 
            max-width: 310px; text-align: center; 
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.5);
            animation: popUp 0.3s ease-out;
        }
        @keyframes popUp {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .notif-header {
            font-family: 'Orbitron', sans-serif;
            color: #00f2fe;
            font-size: 13px;
            margin-bottom: 15px;
            letter-spacing: 2px;
            font-weight: bold;
        }
        .notif-text { margin-bottom: 20px; line-height: 1.6; font-size: 14px; color: #fff; font-weight: 500; }
        
        .btn-close { 
            width: 100%;
            background: linear-gradient(45deg, #ff00cc, #3333ff); 
            color: white; border: none; 
            padding: 12px 25px; border-radius: 10px; font-weight: bold; 
            cursor: pointer; font-family: 'Orbitron'; font-size: 14px;
            box-shadow: 0 4px 10px rgba(255, 0, 204, 0.3);
        }
    </style>
</head>
<body>

    <div id="notifOverlay">
        <div class="notif-card">
            <div class="notif-header">NOTIFIKASI ADMIN PUSAT</div>
            <div id="notifMsg" class="notif-text">Pesan di sini</div>
            <button class="btn-close" onclick="tutupNotif()">OK</button>
        </div>
    </div>

    <div id="loginPage" class="container-box page active">
        <h2>LOGIN ADMIN PUSAT</h2>
        <input type="text" id="userInput" class="input-style" placeholder="Username" autocapitalize="none">
        <input type="password" id="passInput" class="input-style" placeholder="Password">
        <button class="btn-main" onclick="prosesLogin()">MASUK</button>
    </div>

    <div id="adminPanel" class="container-box page">
        <h2>PANEL KONTROL</h2>
        <div id="statusLabel" class="status-display">MENGECEK STATUS...</div>
        <button class="btn-control" style="background:#27ae60" onclick="updateAkses(true)">BUKA AKSES</button>
        <button class="btn-control" style="background:#c0392b" onclick="updateAkses(false)">TUTUP AKSES</button>
        <div style="margin-top: 20px;">
            <button style="background:none; border:none; color:#666; cursor:pointer;" onclick="location.reload()">KELUAR (LOGOUT)</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBX...", 
            authDomain: "nafas-member-app.firebaseapp.com",
            databaseURL: "https://nafas-member-app-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "nafas-member-app",
            storageBucket: "nafas-member-app.appspot.com",
            messagingSenderId: "1001199591736",
            appId: "1:1001199591736:web:fdd9814c9c47feb92021cd"
        };
        
        firebase.initializeApp(firebaseConfig);
        const dbConfig = firebase.database().ref('app_config');

        const DATA_AKUN = [
            { u: "ketua1", p: "123" },
            { u: "admin1", p: "123" }
        ];

        function kirimNotif(teks) {
            document.getElementById('notifMsg').innerText = teks;
            document.getElementById('notifOverlay').style.display = 'flex';
        }

        function tutupNotif() {
            document.getElementById('notifOverlay').style.display = 'none';
        }

        function prosesLogin() {
            const u = document.getElementById('userInput').value.toLowerCase().trim();
            const p = document.getElementById('passInput').value.trim();
            const cek = DATA_AKUN.find(acc => acc.u === u && acc.p === p);
            
            if(cek) {
                document.getElementById('loginPage').classList.remove('active');
                document.getElementById('adminPanel').classList.add('active');
                hubungkanStatus();
            } else {
                kirimNotif("Username atau Password salah ketik.");
            }
        }

        function updateAkses(bol) {
            dbConfig.child('akses_admin').set(bol);
            // REVISI: Menggunakan istilah Admin Pusat untuk pengunci sistem
            const info = bol ? "AKSES DIBUKA!\nSekarang Admin bisa login." : "AKSES DITUTUP!\nAdmin Pusat telah mengunci sistem.";
            kirimNotif(info);
        }

        function hubungkanStatus() {
            dbConfig.child('akses_admin').on('value', (snap) => {
                const el = document.getElementById('statusLabel');
                if(snap.val() === true) {
                    el.innerText = "STATUS: TERBUKA";
                    el.style.color = "#2ecc71";
                } else {
                    el.innerText = "STATUS: TERTUTUP";
                    el.style.color = "#e74c3c";
                }
            });
        }
    </script>
</body>
</html>
