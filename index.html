<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAFAS INDONESIA</title>
    
    <link rel="icon" type="image/png" href="logo_nafas.png">
    <link rel="apple-touch-icon" href="logo_nafas.png">
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="NAFAS">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#6f42c1">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        /* CSS TETAP SAMA AGAR TAMPILAN TIDAK BERUBAH */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; min-height: 100%; background: #0a061a; font-family: 'Montserrat', sans-serif; color: white; overflow-x: hidden; }
        #loginScreen { position: fixed; inset: 0; background: #0a061a; z-index: 99999; display: flex; justify-content: center; align-items: center; }
        .login-box { width: 90%; max-width: 350px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 30px 25px; text-align: center; }
        .login-box h2 { font-family: 'Orbitron', sans-serif; color: #00e5ff; margin-bottom: 5px; }
        .login-box p { font-size: 12px; color: rgba(255,255,255,0.5); margin-bottom: 25px; }
        .login-input { width: 100%; padding: 12px 15px; margin-bottom: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: white; outline: none; }
        .btn-login { width: 100%; padding: 14px; border: none; border-radius: 12px; background: linear-gradient(90deg, #8e2de2, #f00073); color: white; font-weight: bold; font-family: 'Orbitron'; font-size: 16px; cursor: pointer; }
        .page { display: none; width: 100%; min-height: 100vh; justify-content: center; align-items: center; padding: 20px 10px; }
        .page.active { display: flex; }
        .main-wrapper { width: 100%; max-width: 320px; height: 85vh; display: flex; flex-direction: column; justify-content: space-between; text-align: center; }
        .logo-container { width: 110px; height: 110px; margin: 0 auto 10px; display: flex; justify-content: center; align-items: center; cursor: pointer; border-radius: 50%; border: 1px dashed rgba(255,255,255,0.2); overflow: hidden; position: relative; }
        .logo-container img { width: 100%; height: 100%; object-fit: cover; }
        h2 { margin: 10px 0 2px; font-family: 'Orbitron', sans-serif; font-size: 1.2rem; font-weight: 700; color: white; letter-spacing: 2px; }
        .subtitle { margin: 0; font-size: 0.8rem; color: rgba(255,255,255,0.45); letter-spacing: 1.5px; font-weight: 600; }
        .line { width: 80%; margin: 15px auto; height: 1px; background: rgba(255, 255, 255, 0.1); }
        .btn-masuk { background: linear-gradient(90deg, #8e2de2, #f00073); border: none; border-radius: 35px; color: white; padding: 14px 0; width: 85%; font-weight: bold; font-size: 1.1rem; box-shadow: 0 8px 25px rgba(240, 0, 115, 0.4); cursor: pointer; font-family: 'Orbitron', sans-serif; }
        .btn-logout { margin-top: 15px; background: transparent; border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; color: rgba(255,255,255,0.5); padding: 8px 15px; font-size: 0.7rem; cursor: pointer; font-family: 'Orbitron', sans-serif; }
        .app-container { width: 100%; max-width: 420px; background: rgba(10, 6, 26, 0.95); border-radius: 20px; padding: 12px; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 0 40px rgba(0,0,0,0.55); }
        .member-top { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; padding: 12px; margin-bottom: 12px; text-align: center; }
        .member-top h3 { font-size: 20px; font-weight: 900; margin-bottom: 2px; color: #00e5ff; letter-spacing: 1px; font-family: 'Orbitron', sans-serif; }
        .member-top p { font-size: 10px; color: rgba(255,255,255,0.4); margin-bottom: 10px; }
        .search-input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.08); background: rgba(0,0,0,0.4); color: #fff; outline: none; margin-bottom: 10px; font-size: 13px; }
        .top-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 5px; }
        .top-buttons button { border: none; border-radius: 10px; padding: 10px 0; font-weight: 800; color: #fff; font-size: 10px; font-family: 'Orbitron', sans-serif; }
        #notifBox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100000; justify-content: center; align-items: center; }
        .notif-card { background: #161225; border: 2px solid #f00073; padding: 25px; border-radius: 20px; width: 85%; max-width: 300px; text-align: center; box-shadow: 0 0 30px rgba(240, 0, 115, 0.3); animation: popScale 0.3s ease; }
        @keyframes popScale { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .notif-text { font-size: 14px; line-height: 1.6; color: #fff; margin-bottom: 20px; font-weight: 600; }
        .notif-btn { background: #f00073; color: white; border: none; padding: 10px 30px; border-radius: 10px; font-weight: bold; font-family: 'Orbitron'; cursor: pointer; }
        /* LAINNYA TETAP SAMA */
        .member-card { background: rgba(30, 20, 60, 0.6); border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; padding: 10px; margin-bottom: 12px; text-align: left; overflow: hidden; position: relative; }
        .member-header { display: flex; align-items: center; gap: 20px; cursor: pointer; padding: 6px 10px 6px 15px; }
        .photo-ring { width: 72px; height: 72px; border-radius: 50%; position: relative; flex-shrink: 0; display: flex; justify-content: center; align-items: center; }
        .photo-ring::before { content: ""; position: absolute; inset: -3px; border-radius: 50%; background: conic-gradient(#00e5ff,#8a2be2,#ff4fd8,#00e5ff); z-index: -1; }
        .photo-ring img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid rgba(0,0,0,0.6); }
        .member-name h4 { font-size: 18px; font-weight: 900; margin-bottom: 2px; color: #fff; width: 90%; }
        .member-name .id { color: #00e5ff; font-weight: 900; font-size: 13px; }
        .member-name .jabatan { color: rgba(255,255,255,0.8); font-weight: 700; font-size: 12px; }
        .card-body-collapse { display: none; }
        .member-card.active .card-body-collapse { display: block; padding: 10px; }
        .member-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; font-size: 12px; }
        .field label { display: block; font-size: 9px; font-weight: 800; color: rgba(255,255,255,0.35); margin-bottom: 2px; text-transform: uppercase; }
        .field div { font-weight: 800; font-size: 13px; color: #eee; }
        .field.full { grid-column: 1 / -1; }
        .komitmen-box { margin-top: 10px; background: rgba(255,255,255,0.05); border-radius: 14px; padding: 12px; }
        .icon-actions { margin-top: 12px; display: flex; justify-content: space-between; gap: 6px; }
        .icon-btn { flex: 1; background: rgba(255,255,255,0.06); border-radius: 12px; padding: 6px; text-align: center; font-size: 9px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); }
        .icon-btn img { width: 24px; height: 24px; display: block; margin: 0 auto 3px; }
        .member-buttons { margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn-wide { grid-column: 1 / -1; background: #00bcd4; color: white; border: none; padding: 10px; border-radius: 10px; font-family: 'Orbitron'; font-size: 10px; font-weight: bold; }
        .btn-edit { background: #caa10b; color: white; border: none; padding: 10px; border-radius: 10px; font-family: 'Orbitron'; font-size: 10px; font-weight: bold; }
        .btn-hapus { background: #d92c2c; color: white; border: none; padding: 10px; border-radius: 10px; font-family: 'Orbitron'; font-size: 10px; font-weight: bold; }
        .overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .modal-form { width: 90%; max-width: 400px; background: #2a0e4a; border-radius: 20px; padding: 20px; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; margin-bottom: 4px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border-radius: 8px; background: rgba(0,0,0,0.3); color: white; border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>

    <div id="notifBox">
        <div class="notif-card">
            <div id="notifMsg" class="notif-text">Pesan di sini</div>
            <button class="notif-btn" onclick="tutupNotif()">OKE</button>
        </div>
    </div>

    <div id="loginScreen">
        <div class="login-box">
            <h2>LOGIN PENGELOLA</h2>
            <p>Masukkan Username & Password</p>
            <input type="text" id="user" class="login-input" placeholder="Username">
            <input type="password" id="pass" class="login-input" placeholder="Password">
            <button class="btn-login" onclick="cekLogin()">MASUK</button>
        </div>
    </div>

    <div id="pageBeranda" class="page">
        <div class="main-wrapper">
            <div class="top-group">
                <div class="logo-container" id="logoBtn">
                    <div id="logoDisplay"> Pasang Logo </div>
                </div>
                <h2>NAFAS INDONESIA</h2>
                <p class="subtitle">NEW AMEL FANS SEJATI</p>
                <div class="line"></div>
            </div>
            <div class="middle-group">
                <button class="btn-masuk" onclick="showPage('pageMember')">MEMBER</button>
                <br>
                <button class="btn-logout" onclick="logout()">LOGOUT</button>
            </div>
            <div class="footer">© NAFAS INDONESIA COMMUNITY</div>
        </div>
    </div>

    <div id="pageMember" class="page">
        <div class="app-container">
            <div class="member-top">
                <h3>DATABASE MEMBER</h3>
                <p>NEW AMEL FANS SEJATI</p>
                <input class="search-input" id="searchMember" placeholder="Cari Member..." oninput="renderMembers()"/>
                <div class="top-buttons">
                    <button style="background:#d92c2c" onclick="resetFoto()">RESET FOTO</button>
                    <button style="background:#1faa58" onclick="openFormTambah()">TAMBAH</button>
                    <button style="background:#2367ff" onclick="exportCSV()">EXPORT CSV</button>
                    <button style="background:#444" onclick="showPage('pageBeranda')">KEMBALI</button>
                </div>
            </div>
            <div id="memberList"></div>
        </div>
    </div>

    <div class="overlay" id="formOverlay">
        <div class="modal-form">
            <h2 id="formTitle" style="text-align:center; margin-bottom:15px; font-family:'Orbitron';">TAMBAH MEMBER</h2>
            <input type="hidden" id="editIndex">
            <input type="hidden" id="firebaseKey"> 
            <div class="form-group"><label>NAMA</label><input type="text" id="f_nama"></div>
            <div class="form-group"><label>JABATAN</label><input type="text" id="f_jabatan"></div>
            <div class="form-group"><label>ID</label><input type="text" id="f_id"></div>
            <div class="form-group"><label>NOMOR HP</label><input type="text" id="f_hp"></div>
            <div class="form-group"><label>TTL</label><input type="text" id="f_ttl"></div>
            <div class="form-group"><label>JENIS KELAMIN</label><select id="f_jk"><option value="Laki-Laki">Laki-Laki</option><option value="Perempuan">Perempuan</option></select></div>
            <div class="form-group"><label>ALAMAT</label><textarea id="f_alamat"></textarea></div>
            <div class="form-group"><label>KECAMATAN</label><input type="text" id="f_kec"></div>
            <div class="form-group"><label>KOTA</label><input type="text" id="f_kota"></div>
            <div class="form-group"><label>PROVINSI</label><input type="text" id="f_prov"></div>
            <div class="form-group"><label>AGAMA</label><input type="text" id="f_agama"></div>
            <div class="form-group"><label>PEKERJAAN</label><input type="text" id="f_kerja"></div>
            <div class="form-group"><label>HOBBY</label><input type="text" id="f_hobby"></div>
            <div class="form-group"><label>KOMITMEN</label><textarea id="f_komitmen"></textarea></div>
            <div class="member-buttons">
                <button class="btn-hapus" onclick="closeForm()">BATAL</button>
                <button style="background:#1faa58" class="btn-edit" onclick="simpanMember()">SIMPAN</button>
            </div>
        </div>
    </div>

    <input type="file" id="logoInput" hidden accept="image/*">

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBX...", 
            authDomain: "nafas-member-app.firebaseapp.com",
            databaseURL: "https://nafas-member-app-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "nafas-member-app",
            storageBucket: "nafas-member-app.appspot.com",
            messagingSenderId: "1001199591736",
            appId: "1:1001199591736:web:fdd9814c9c47feb92021cd"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const dbRef = database.ref('members');
        const logoRef = database.ref('app_config/logo');
        const configRef = database.ref('app_config');

        const USERNAME = "naafcfast@gmail.com";
        const PASSWORD = "Nafas130521";
        let members = [];
        let membersKeys = [];

        function kirimNotif(pesan) {
            document.getElementById('notifMsg').innerText = pesan;
            document.getElementById('notifBox').style.display = 'flex';
        }
        function tutupNotif() {
            document.getElementById('notifBox').style.display = 'none';
        }

        // --- SISTEM KEAMANAN GAYA NAFAS ---
        configRef.child('akses_admin').on('value', (snap) => {
            if (snap.val() === false) {
                kirimNotif("AKSES DIPROTEKSI: Pengelola telah mengunci sistem untuk Member NAFAS.");
                setTimeout(() => { location.reload(); }, 2500); 
            }
        });

        function cekLogin() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            configRef.child('akses_admin').once('value', (snap) => {
                if (snap.val() === false) {
                    kirimNotif("OTORISASI GAGAL: Akses masuk saat ini sedang ditutup oleh Pengelola.");
                    return;
                }
                if(u === USERNAME && p === PASSWORD) {
                    document.getElementById('loginScreen').style.display = 'none';
                    showPage('pageBeranda');
                } else { kirimNotif('Username atau Password Salah!'); }
            });
        }

        function logout() {
            if(confirm("Keluar dari aplikasi NAFAS?")) {
                document.getElementById('user').value = "";
                document.getElementById('pass').value = "";
                document.getElementById('loginScreen').style.display = 'flex';
                showPage('pageBeranda');
            }
        }

        window.onload = function() {
            logoRef.on('value', (snap) => {
                const url = snap.val();
                if(url) document.getElementById('logoDisplay').innerHTML = `<img src="${url}" style="width:100%; height:100%; border-radius:50%;">`;
            });
            dbRef.on('value', (snap) => {
                members = []; membersKeys = [];
                snap.forEach((child) => {
                    members.push(child.val());
                    membersKeys.push(child.key);
                });
                renderMembers();
            });
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function openFormTambah() {
            document.getElementById("formTitle").innerText = "TAMBAH MEMBER";
            document.getElementById("editIndex").value = "-1";
            clearForm();
            document.getElementById("formOverlay").style.display = "flex";
        }

        function openFormEdit(idx) {
            const m = members[idx];
            document.getElementById("formTitle").innerText = "EDIT MEMBER";
            document.getElementById("editIndex").value = idx;
            document.getElementById("firebaseKey").value = membersKeys[idx];
            document.getElementById("f_nama").value = m.nama;
            document.getElementById("f_id").value = m.id;
            document.getElementById("f_hp").value = m.hp;
            document.getElementById("formOverlay").style.display = "flex";
        }

        function closeForm() { document.getElementById("formOverlay").style.display = "none"; }
        function clearForm() { ["f_nama","f_id","f_hp","f_ttl","f_alamat","f_kec","f_kota","f_prov","f_agama","f_kerja","f_hobby","f_komitmen"].forEach(id=>document.getElementById(id).value=""); }

        function simpanMember() {
            const idx = parseInt(document.getElementById("editIndex").value);
            const key = document.getElementById("firebaseKey").value;
            const data = {
                nama: document.getElementById("f_nama").value.toUpperCase(),
                id: document.getElementById("f_id").value,
                hp: document.getElementById("f_hp").value,
                ttl: document.getElementById("f_ttl").value,
                jk: document.getElementById("f_jk").value,
                alamat: document.getElementById("f_alamat").value,
                kec: document.getElementById("f_kec").value,
                kota: document.getElementById("f_kota").value,
                prov: document.getElementById("f_prov").value,
                agama: document.getElementById("f_agama").value,
                kerja: document.getElementById("f_kerja").value,
                hobby: document.getElementById("f_hobby").value,
                komitmen: document.getElementById("f_komitmen").value,
                foto: idx >= 0 ? (members[idx].foto || "") : ""
            };
            if(idx === -1) { dbRef.push(data); } else { dbRef.child(key).update(data); }
            closeForm();
            kirimNotif("DATA TERENKRIPSI: Pengelola berhasil mengamankan data ke sistem Awan NAFAS.");
        }

        function renderMembers() {
            const list = document.getElementById("memberList");
            const q = document.getElementById("searchMember").value.toLowerCase();
            list.innerHTML = "";
            members.forEach((m, idx) => {
                if(m.nama.toLowerCase().includes(q) || m.id.includes(q)) {
                    const card = document.createElement("div");
                    card.className = "member-card";
                    card.innerHTML = `
                        <div class="member-header" onclick="this.parentElement.classList.toggle('active')">
                            <div class="photo-ring"><img src="${m.foto || 'https://cdn-icons-png.flaticon.com/512/847/847969.png'}"></div>
                            <div class="member-name"><h4>${m.nama}</h4><div class="id">ID: ${m.id}</div></div>
                        </div>
                        <div class="card-body-collapse">
                            <div class="member-grid">
                                <div class="field"><label>No HP</label><div>${m.hp}</div></div>
                                <div class="field"><label>Kota</label><div>${m.kota}</div></div>
                            </div>
                            <div class="member-buttons">
                                <button class="btn-wide" onclick="pilihFoto(${idx})">PILIH FOTO</button>
                                <button class="btn-edit" onclick="openFormEdit(${idx})">EDIT</button>
                                <button class="btn-hapus" onclick="hapusMember(${idx})">HAPUS</button>
                            </div>
                        </div>
                    `;
                    list.appendChild(card);
                }
            });
        }

        function pilihFoto(idx) {
            const key = membersKeys[idx];
            const inp = document.createElement("input"); inp.type="file"; inp.accept="image/*";
            inp.onchange = e => {
                const reader = new FileReader();
                reader.onload = f => { dbRef.child(key).update({ foto: f.target.result }); };
                reader.readAsDataURL(e.target.files[0]);
            };
            inp.click();
        }

        function hapusMember(idx) {
            if(confirm("Hapus data Member NAFAS ini?")) { dbRef.child(membersKeys[idx]).remove(); }
        }

        function resetFoto() {
            if (confirm("PENGELOLA: Hapus SEMUA foto Member NAFAS?")) {
                membersKeys.forEach(key => dbRef.child(key).update({ foto: "" }));
                kirimNotif("SISTEM DIPERBARUI: Pengelola telah meriset seluruh foto member.");
            }
        }

        function exportCSV() {
            let csv = "ID,Nama,HP,Kota\n";
            members.forEach(m=> csv += `${m.id},${m.nama},${m.hp},${m.kota}\n`);
            const blob = new Blob([csv], {type:'text/csv'});
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href=url; a.download='member_nafas.csv'; a.click();
        }
    </script>
</body>
</html>
