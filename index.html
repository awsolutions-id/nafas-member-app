<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAFAS INDONESIA</title>
    
    <link rel="icon" type="image/png" href="logo_nafas.png">
    <link rel="apple-touch-icon" href="logo_nafas.png">
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="NAFAS">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#6f42c1">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; min-height: 100%; background: #0a061a; font-family: 'Montserrat', sans-serif; color: white; overflow-x: hidden; }
        
        #loginScreen { position: fixed; inset: 0; background: #0a061a; z-index: 99999; display: flex; justify-content: center; align-items: center; }
        .login-box { width: 90%; max-width: 320px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 30px 25px; text-align: center; }
        .login-box h2 { font-family: 'Orbitron', sans-serif; color: #00e5ff; margin-bottom: 5px; font-size: 1.2rem; }
        .login-box p { font-size: 11px; color: rgba(255,255,255,0.5); margin-bottom: 25px; }
        .login-input { width: 100%; padding: 12px 15px; margin-bottom: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: white; outline: none; font-size: 13px; }
        .btn-login { width: 100%; padding: 14px; border: none; border-radius: 12px; background: linear-gradient(90deg, #8e2de2, #f00073); color: white; font-weight: bold; font-family: 'Orbitron'; font-size: 14px; cursor: pointer; }

        /* NOTIFIKASI REVISI: LEBIH KECIL & WARNA SERASI */
        #neonNotifOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 100000; display: none; justify-content: center; align-items: center; }
        .neon-notif-box { width: 80%; max-width: 280px; background: #0d0d0d; border: 1.5px solid #00e5ff; border-radius: 15px; padding: 20px; text-align: center; box-shadow: 0 0 15px rgba(0, 229, 255, 0.3); }
        .neon-notif-header { font-family: 'Orbitron', sans-serif; color: #00e5ff; font-size: 11px; margin-bottom: 12px; font-weight: 900; letter-spacing: 1.5px; }
        .neon-notif-msg { font-size: 12px; color: #eee; margin-bottom: 20px; line-height: 1.4; font-weight: 500; }
        .neon-notif-btn-container { display: flex; flex-direction: column; gap: 8px; }
        .btn-neon-oke { background: linear-gradient(90deg, #8e2de2, #f00073); border: none; border-radius: 8px; color: white; padding: 10px; font-family: 'Orbitron'; font-size: 11px; font-weight: bold; cursor: pointer; }
        .btn-neon-batal { background: transparent; border: 1px solid #444; border-radius: 8px; color: #888; padding: 8px; font-family: 'Orbitron'; font-size: 9px; cursor: pointer; }
        .btn-neon-input { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #00e5ff; background: #000; color: #fff; margin-bottom: 12px; outline: none; font-size: 12px; display: none; }

        .page { display: none; width: 100%; min-height: 100vh; justify-content: center; align-items: center; padding: 20px 10px; }
        .page.active { display: flex; }
        .main-wrapper { width: 100%; max-width: 320px; height: 85vh; display: flex; flex-direction: column; justify-content: space-between; text-align: center; }
        .logo-container { width: 110px; height: 110px; margin: 0 auto 10px; display: flex; justify-content: center; align-items: center; cursor: pointer; border-radius: 50%; border: 1px dashed rgba(255,255,255,0.2); overflow: hidden; position: relative; }
        .logo-container img { width: 100%; height: 100%; object-fit: cover; }
        h2 { margin: 10px 0 2px; font-family: 'Orbitron', sans-serif; font-size: 1.2rem; font-weight: 700; color: white; letter-spacing: 2px; }
        .subtitle { margin: 0; font-size: 0.8rem; color: rgba(255,255,255,0.45); letter-spacing: 1.5px; font-weight: 600; }
        .line { width: 80%; margin: 15px auto; height: 1px; background: rgba(255, 255, 255, 0.1); }
        .btn-masuk { background: linear-gradient(90deg, #8e2de2, #f00073); border: none; border-radius: 35px; color: white; padding: 14px 0; width: 85%; font-weight: bold; font-size: 1.1rem; box-shadow: 0 8px 25px rgba(240, 0, 115, 0.4); cursor: pointer; font-family: 'Orbitron', sans-serif; }
        
        .btn-logout { margin-top: 15px; background: transparent; border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; color: rgba(255,255,255,0.5); padding: 8px 15px; font-size: 0.7rem; cursor: pointer; font-family: 'Orbitron', sans-serif; }

        .feature-title { font-size: 0.75rem; color: rgba(255,255,255,0.3); margin-bottom: 20px; display: block; font-weight: 700; letter-spacing: 1px; }
        .icon-grid { display: flex; justify-content: center; gap: 15px; }
        .icon-item { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 62px; cursor: pointer; }
        .icon-box { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; width: 42px; height: 42px; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; color: #00e5ff; }
        .icon-label { font-size: 0.55rem; color: rgba(255,255,255,0.85); font-weight: 700; text-transform: uppercase; line-height: 1.2; }
        .footer { margin-top: 50px; font-size: 0.55rem; color: rgba(255,255,255,0.2); letter-spacing: 0.5px; font-weight: 400; }
        
        .app-container { width: 100%; max-width: 420px; background: rgba(10, 6, 26, 0.95); border-radius: 20px; padding: 12px; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 0 40px rgba(0,0,0,0.55); }
        .member-top { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; padding: 12px; margin-bottom: 12px; text-align: center; }
        .member-top h3 { font-size: 20px; font-weight: 900; margin-bottom: 2px; color: #00e5ff; letter-spacing: 1px; font-family: 'Orbitron', sans-serif; }
        .member-top p { font-size: 10px; color: rgba(255,255,255,0.4); margin-bottom: 10px; }
        .search-input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.08); background: rgba(0,0,0,0.4); color: #fff; outline: none; margin-bottom: 10px; font-size: 13px; }
        .top-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 5px; }
        .top-buttons button { border: none; border-radius: 10px; padding: 10px 0; font-weight: 800; color: #fff; font-size: 10px; font-family: 'Orbitron', sans-serif; }
        
        .member-card { background: rgba(30, 20, 60, 0.6); border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; padding: 10px; margin-bottom: 12px; text-align: left; overflow: hidden; position: relative; }
        .member-header { display: flex; align-items: center; gap: 20px; cursor: pointer; padding: 6px 10px 6px 15px; }
        .member-header::after { 
            content: '\f107'; font-family: 'Font Awesome 6 Free'; font-weight: 900; 
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%); 
            color: #00e5ff; font-size: 1.1rem; transition: 0.3s; 
        }
        .member-card.active .member-header::after { transform: translateY(-50%) rotate(180deg); }
        .member-card.active .member-header { border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 10px; padding-bottom: 8px; }
        .card-body-collapse { display: none; }
        .member-card.active .card-body-collapse { display: block; animation: slideDown 0.3s ease-out; padding-left: 5px; padding-right: 5px; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

        .photo-ring { width: 72px; height: 72px; border-radius: 50%; position: relative; flex-shrink: 0; display: flex; justify-content: center; align-items: center; }
        .photo-ring::before { content: ""; position: absolute; inset: -3px; border-radius: 50%; background: conic-gradient(#00e5ff,#8a2be2,#ff4fd8,#00e5ff); z-index: -1; }
        .photo-ring img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid rgba(0,0,0,0.6); }
        
        .member-name h4 { font-size: 18px; font-weight: 900; margin-bottom: 2px; color: #fff; width: 90%; }
        .member-name .id { color: #00e5ff; font-weight: 900; font-size: 13px; }
        .member-name .jabatan { color: rgba(255,255,255,0.8); font-weight: 700; font-size: 12px; }

        .member-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; font-size: 12px; padding: 0 10px; }
        .field label { display: block; font-size: 9px; font-weight: 800; color: rgba(255,255,255,0.35); margin-bottom: 2px; text-transform: uppercase; }
        .field div { font-weight: 800; font-size: 13px; color: #eee; }
        .field.full { grid-column: 1 / -1; }
        
        .komitmen-box { margin: 10px; background: rgba(255,255,255,0.05); border-radius: 14px; padding: 12px; }
        .komitmen-box h5 { font-size: 10px; color: rgba(255,255,255,0.4); margin-bottom: 4px; }
        .komitmen-box p { font-weight: 700; font-size: 12px; color: #fff; line-height: 1.4; }
        
        .icon-actions { margin: 12px 10px; display: flex; justify-content: space-between; gap: 6px; }
        .icon-btn { flex: 1; background: rgba(255,255,255,0.06); border-radius: 12px; padding: 6px; text-align: center; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); }
        .icon-btn img { width: 24px; height: 24px; display: block; margin: 0 auto 3px; }
        .icon-btn span { display: block; font-weight: 800; font-size: 9px; }
        
        .member-buttons { margin: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn-wide { grid-column: 1 / -1; border: none; border-radius: 12px; padding: 10px; font-weight: 800; background: #00bcd4; color: #fff; font-family: 'Orbitron'; font-size: 10px; }
        .btn-edit { border: none; border-radius: 12px; padding: 10px; font-weight: 800; background: #caa10b; color: #fff; font-family: 'Orbitron'; font-size: 10px; }
        .btn-hapus { border: none; border-radius: 12px; padding: 10px; font-weight: 800; background: #d92c2c; color: #fff; font-family: 'Orbitron'; font-size: 10px; }
        .btn-kembali { grid-column: 1 / -1; border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 10px; font-weight: 800; background: transparent; color: #fff; font-family: 'Orbitron'; font-size: 10px; }
        
        .overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; padding: 20px; z-index: 9999; }
        .overlay.active { display: flex; }
        .popup-box { width: 90%; max-width: 350px; background: #161225; border-radius: 25px; padding: 20px; text-align: center; }
        .popup-title { font-family: 'Orbitron', sans-serif; font-size: 1rem; color: #00e5ff; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; }
        .popup-text { width: 100%; height: 200px; background: #000; border: 1px solid #333; border-radius: 15px; color: #fff; padding: 15px; font-size: 14px; margin-bottom: 20px; outline: none; resize: none; }
        .modal-form { width: 100%; max-width: 400px; background: #2a0e4a; border-radius: 20px; padding: 20px; border: 1px solid rgba(255,255,255,0.15); max-height: 90vh; overflow-y: auto; color: white; }
        .form-group { margin-bottom: 12px; text-align: left; }
        .form-group label { display: block; font-size: 11px; color: rgba(255,255,255,0.5); margin-bottom: 4px; font-weight: bold; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: #fff; outline: none; font-size: 14px; }
        .btn-action { border: none; padding: 10px 15px; border-radius: 10px; font-size: 10px; font-weight: bold; cursor: pointer; color: white; font-family: 'Orbitron', sans-serif; }
    </style>
</head>
<body>

    <div id="neonNotifOverlay">
        <div class="neon-notif-box">
            <div class="neon-notif-header" id="neonHeader">NOTIFIKASI ADMIN</div>
            <div id="neonMessage" class="neon-notif-msg">Pesan...</div>
            <input type="text" id="neonInput" class="btn-neon-input">
            <div class="neon-notif-btn-container">
                <button id="btnNeonOke" class="btn-neon-oke">OK</button>
                <button id="btnNeonBatal" class="btn-neon-batal">BATAL</button>
            </div>
        </div>
    </div>

    <div id="loginScreen">
        <div class="login-box">
            <h2>LOGIN ADMIN</h2>
            <p>Masukkan Username & Password</p>
            <input type="text" id="user" class="login-input" placeholder="Username">
            <input type="password" id="pass" class="login-input" placeholder="Password">
            <button class="btn-login" onclick="cekLogin()">MASUK</button>
        </div>
    </div>

    <div id="pageBeranda" class="page">
        <div class="main-wrapper">
            <div class="top-group">
                <div class="logo-container" id="logoBtn">
                    <div id="logoDisplay"><span id="logoPlaceholder">Pasang Logo</span></div>
                </div>
                <h2>NAFAS INDONESIA</h2>
                <p class="subtitle">NEW AMEL FANS SEJATI</p>
                <div class="line"></div>
            </div>
            <div class="middle-group">
                <button class="btn-masuk" onclick="showPage('pageMember')">MEMBER</button>
                <br>
                <button class="btn-logout" onclick="logout()">LOGOUT</button>
            </div>
            <div class="bottom-group">
                <span class="feature-title">MENU LAYANAN GROUP</span>
                <div class="icon-grid">
                    <div class="icon-item" onclick="openPopup('TATA TERTIB')">
                        <div class="icon-box"><i class="fas fa-gavel"></i></div>
                        <span class="icon-label">TATA<br>TERTIB</span>
                    </div>
                    <div class="icon-item" onclick="openPopup('PROFIL')">
                        <div class="icon-box"><i class="fas fa-user"></i></div>
                        <span class="icon-label">PROFIL</span>
                    </div>
                    <div class="icon-item" onclick="openPopup('MEDSOS')">
                        <div class="icon-box"><i class="fas fa-share-nodes"></i></div>
                        <span class="icon-label">MEDSOS</span>
                    </div>
                    <div class="icon-item" onclick="openPopup('STRUKTUR')">
                        <div class="icon-box"><i class="fas fa-sitemap"></i></div>
                        <span class="icon-label">STRUKTUR</span>
                    </div>
                </div>
                <div class="footer">© NAFAS INDONESIA COMMUNITY</div>
            </div>
        </div>
    </div>

    <div id="pageMember" class="page">
        <div class="app-container">
            <div class="member-top">
                <h3>DATABASE MEMBER</h3>
                <p>NEW AMEL FANS SEJATI</p>
                <input class="search-input" id="searchMember" placeholder="Cari Member..." oninput="renderMembers()"/>
                <div class="top-buttons">
                    <button style="background:#d92c2c" onclick="resetFoto()">RESET FOTO</button>
                    <button style="background:#1faa58" onclick="openFormTambah()">TAMBAH</button>
                    <button style="background:#2367ff" onclick="exportCSV()">EXPORT CSV</button>
                    <button style="background:#444" onclick="showPage('pageBeranda')">KEMBALI</button>
                </div>
            </div>
            <div id="memberList"></div>
        </div>
    </div>

    <div class="overlay" id="popupOverlay">
        <div class="popup-box">
            <h3 id="popupTitleLabel" class="popup-title">JUDUL</h3>
            <textarea id="popupText" class="popup-text" readonly></textarea>
            <div style="display:flex; justify-content:center; gap:10px;">
                <button class="btn-action" style="background:#f39c12" onclick="enableEdit()">EDIT</button>
                <button class="btn-action" style="background:#27ae60" onclick="saveDataPopup()">SIMPAN</button>
                <button class="btn-action" style="background:#c0392b" onclick="closePopup()">TUTUP</button>
            </div>
        </div>
    </div>

    <div class="overlay" id="formOverlay">
        <div class="modal-form">
            <h2 id="formTitle" style="font-family:'Orbitron'; font-size:18px; margin-bottom:15px; text-align:center;">TAMBAH MEMBER</h2>
            <input type="hidden" id="editIndex">
            <input type="hidden" id="firebaseKey"> 
            
            <div class="form-group"><label>NAMA</label><input type="text" id="f_nama"></div>
            <div class="form-group"><label>JABATAN</label><input type="text" id="f_jabatan"></div>
            <div class="form-group"><label>ID</label><input type="text" id="f_id"></div>
            <div class="form-group"><label>NOMOR HP</label><input type="text" id="f_hp"></div>
            <div class="form-group"><label>TTL</label><input type="text" id="f_ttl"></div>
            <div class="form-group"><label>JENIS KELAMIN</label>
                <select id="f_jk"><option value="Laki-Laki">Laki-Laki</option><option value="Perempuan">Perempuan</option></select>
            </div>
            <div class="form-group"><label>ALAMAT</label><textarea id="f_alamat"></textarea></div>
            <div class="form-group"><label>KELURAHAN</label><input type="text" id="f_kel"></div>
            <div class="form-group"><label>KECAMATAN</label><input type="text" id="f_kec"></div>
            <div class="form-group"><label>KOTA</label><input type="text" id="f_kota"></div>
            <div class="form-group"><label>PROVINSI</label><input type="text" id="f_prov"></div>
            <div class="form-group"><label>NEGARA</label><input type="text" id="f_negara"></div>
            <div class="form-group"><label>KODE POS</label><input type="text" id="f_pos"></div>
            <div class="form-group"><label>AGAMA</label><input type="text" id="f_agama"></div>
            <div class="form-group"><label>PEKERJAAN</label><input type="text" id="f_kerja"></div>
            <div class="form-group"><label>HOBBY</label><input type="text" id="f_hobby"></div>
            <div class="form-group"><label>KOMITMEN</label><textarea id="f_komitmen"></textarea></div>
            <div class="member-buttons">
                <button class="btn-hapus" onclick="closeForm()">BATAL</button>
                <button style="background:#1faa58" class="btn-edit" onclick="simpanMember()">SIMPAN</button>
            </div>
        </div>
    </div>

    <input type="file" id="logoInput" hidden accept="image/*">

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBX...", 
            authDomain: "nafas-member-app.firebaseapp.com",
            databaseURL: "https://nafas-member-app-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "nafas-member-app",
            storageBucket: "nafas-member-app.appspot.com",
            messagingSenderId: "1001199591736",
            appId: "1:1001199591736:web:fdd9814c9c47feb92021cd"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const dbRef = database.ref('members');
        const logoRef = database.ref('app_config/logo');
        const popupRef = database.ref('app_config/popups');
        const configRef = database.ref('app_config');

        const USERNAME = "naafcfast@gmail.com";
        const PASSWORD = "Nafas130521";
        
        let members = [];
        let membersKeys = [];

        // FUNGSI NOTIFIKASI KUSTOM REVISI
        function customNotif(pesan, tipe = 'alert', callback = null) {
            const overlay = document.getElementById('neonNotifOverlay');
            const msg = document.getElementById('neonMessage');
            const input = document.getElementById('neonInput');
            const btnOke = document.getElementById('btnNeonOke');
            const btnBatal = document.getElementById('btnNeonBatal');
            
            msg.innerText = pesan;
            input.style.display = 'none';
            btnBatal.style.display = 'none';
            overlay.style.display = 'flex';

            if(tipe === 'confirm') {
                btnBatal.style.display = 'block';
                btnOke.onclick = () => { overlay.style.display = 'none'; if(callback) callback(true); };
                btnBatal.onclick = () => { overlay.style.display = 'none'; if(callback) callback(false); };
            } else if(tipe === 'prompt') {
                input.style.display = 'block';
                input.value = "";
                btnBatal.style.display = 'block';
                btnOke.onclick = () => { overlay.style.display = 'none'; if(callback) callback(input.value); };
                btnBatal.onclick = () => { overlay.style.display = 'none'; if(callback) callback(null); };
            } else {
                btnOke.onclick = () => { overlay.style.display = 'none'; if(callback) callback(); };
            }
        }

        configRef.child('akses_admin').on('value', (snap) => {
            const isAktif = snap.val();
            if (isAktif === false) {
                customNotif("AKSES DITUTUP: Admin Pusat telah mengunci sistem.", 'alert', () => location.reload());
            }
        });

        function cekLogin() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            configRef.child('akses_admin').once('value', (snap) => {
                if (snap.val() === false) {
                    customNotif("Gagal Masuk: Akses sistem sedang TERTUTUP.");
                    return;
                }
                if(u === USERNAME && p === PASSWORD) {
                    document.getElementById('loginScreen').style.display = 'none';
                    showPage('pageBeranda');
                } else { customNotif('Username atau Password Salah!'); }
            });
        }

        function logout() {
            customNotif("Keluar dari aplikasi?", 'confirm', (res) => {
                if(res) {
                    document.getElementById('user').value = "";
                    document.getElementById('pass').value = "";
                    document.getElementById('loginScreen').style.display = 'flex';
                    showPage('pageBeranda');
                }
            });
        }

        window.onload = function() {
            logoRef.on('value', (snap) => {
                const url = snap.val();
                if(url) document.getElementById('logoDisplay').innerHTML = `<img src="${url}">`;
            });
            dbRef.on('value', (snap) => {
                members = [];
                membersKeys = [];
                snap.forEach((child) => {
                    members.push(child.val());
                    membersKeys.push(child.key);
                });
                renderMembers();
            });
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            window.scrollTo(0,0);
        }

        const logoBtn = document.getElementById('logoBtn');
        const logoInput = document.getElementById('logoInput');
        logoBtn.onclick = () => logoInput.click();
        logoInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    logoRef.set(event.target.result);
                };
                reader.readAsDataURL(file);
            }
        };

        let currentPopupKey = "";
        function openPopup(title) {
            currentPopupKey = title.replace(/\s/g, "_");
            document.getElementById('popupTitleLabel').innerText = title;
            popupRef.child(currentPopupKey).once('value', (snap) => {
                document.getElementById('popupText').value = snap.val() || "Belum ada data.";
            });
            document.getElementById('popupText').readOnly = true;
            document.getElementById('popupOverlay').style.display = 'flex';
        }
        function closePopup() { document.getElementById('popupOverlay').style.display = 'none'; }
        function enableEdit() { document.getElementById('popupText').readOnly = false; document.getElementById('popupText').focus(); }
        function saveDataPopup() {
            popupRef.child(currentPopupKey).set(document.getElementById('popupText').value);
            document.getElementById('popupText').readOnly = true;
            customNotif("Berhasil disimpan ke Awan!");
        }

        function openFormTambah() {
            document.getElementById("formTitle").innerText = "TAMBAH MEMBER";
            document.getElementById("editIndex").value = "-1";
            document.getElementById("firebaseKey").value = "";
            clearForm();
            document.getElementById("formOverlay").classList.add("active");
        }

        function openFormEdit(idx) {
            const m = members[idx];
            document.getElementById("formTitle").innerText = "EDIT MEMBER";
            document.getElementById("editIndex").value = idx;
            document.getElementById("firebaseKey").value = membersKeys[idx];
            document.getElementById("f_nama").value = m.nama;
            document.getElementById("f_jabatan").value = m.jabatan || ""; 
            document.getElementById("f_id").value = m.id;
            document.getElementById("f_hp").value = m.hp;
            document.getElementById("f_ttl").value = m.ttl;
            document.getElementById("f_jk").value = m.jk;
            document.getElementById("f_alamat").value = m.alamat;
            document.getElementById("f_kel").value = m.kel || "";
            document.getElementById("f_kec").value = m.kec;
            document.getElementById("f_kota").value = m.kota;
            document.getElementById("f_prov").value = m.prov;
            document.getElementById("f_negara").value = m.negara || "Indonesia";
            document.getElementById("f_pos").value = m.pos;
            document.getElementById("f_agama").value = m.agama;
            document.getElementById("f_kerja").value = m.kerja;
            document.getElementById("f_hobby").value = m.hobby;
            document.getElementById("f_komitmen").value = m.komitmen;
            document.getElementById("formOverlay").classList.add("active");
        }

        function closeForm() { document.getElementById("formOverlay").classList.remove("active"); }
        function clearForm() { ["f_nama","f_jabatan","f_id","f_hp","f_ttl","f_alamat","f_kel","f_kec","f_kota","f_prov","f_negara","f_pos","f_agama","f_kerja","f_hobby","f_komitmen"].forEach(id=>document.getElementById(id).value=""); }

        function simpanMember() {
            const idx = parseInt(document.getElementById("editIndex").value);
            const key = document.getElementById("firebaseKey").value;
            const data = {
                nama: document.getElementById("f_nama").value.toUpperCase(),
                jabatan: document.getElementById("f_jabatan").value || "Anggota",
                id: document.getElementById("f_id").value,
                hp: document.getElementById("f_hp").value,
                ttl: document.getElementById("f_ttl").value,
                jk: document.getElementById("f_jk").value,
                alamat: document.getElementById("f_alamat").value,
                kel: document.getElementById("f_kel").value,
                kec: document.getElementById("f_kec").value,
                kota: document.getElementById("f_kota").value,
                prov: document.getElementById("f_prov").value,
                negara: document.getElementById("f_negara").value || "Indonesia",
                pos: document.getElementById("f_pos").value,
                agama: document.getElementById("f_agama").value,
                kerja: document.getElementById("f_kerja").value,
                hobby: document.getElementById("f_hobby").value,
                komitmen: document.getElementById("f_komitmen").value,
                foto: idx >= 0 ? (members[idx].foto || "") : ""
            };
            if(idx === -1) { dbRef.push(data); } else { dbRef.child(key).update(data); }
            closeForm();
            customNotif("Data Member Berhasil Disimpan!");
        }

        function renderMembers() {
            const list = document.getElementById("memberList");
            const q = document.getElementById("searchMember").value.toLowerCase();
            list.innerHTML = "";
            members.forEach((m, idx) => {
                if(m.nama.toLowerCase().includes(q) || m.id.includes(q)) {
                    const card = document.createElement("div");
                    card.className = "member-card";
                    card.innerHTML = `
                        <div class="member-header" onclick="this.parentElement.classList.toggle('active')">
                            <div class="photo-ring"><img src="${m.foto || 'https://cdn-icons-png.flaticon.com/512/847/847969.png'}"></div>
                            <div class="member-name">
                                <h4>${m.nama}</h4>
                                <div class="id">ID: ${m.id}</div>
                                <div class="jabatan">${m.jabatan || 'Anggota'}</div>
                            </div>
                        </div>

                        <div class="card-body-collapse">
                            <div class="member-grid">
                                <div class="field"><label>TTL</label><div>${m.ttl}</div></div>
                                <div class="field"><label>Jenis Kelamin</label><div>${m.jk}</div></div>
                                <div class="field full"><label>Alamat</label><div>${m.alamat}</div></div>
                                <div class="field"><label>Kelurahan</label><div>${m.kel || "-"}</div></div>
                                <div class="field"><label>Kecamatan</label><div>${m.kec}</div></div>
                                <div class="field"><label>Kota</label><div>${m.kota}</div></div>
                                <div class="field"><label>Provinsi</label><div>${m.prov}</div></div>
                                <div class="field"><label>Negara</label><div>${m.negara || "Indonesia"}</div></div>
                                <div class="field"><label>Kode Pos</label><div>${m.pos}</div></div>
                                <div class="field"><label>Agama</label><div>${m.agama}</div></div>
                                <div class="field"><label>No HP</label><div>${m.hp}</div></div>
                                <div class="field"><label>Pekerjaan</label><div>${m.kerja}</div></div>
                                <div class="field"><label>Hobby</label><div>${m.hobby}</div></div>
                            </div>
                            <div class="komitmen-box"><h5>KOMITMEN</h5><p>${m.komitmen}</p></div>
                            <div class="icon-actions">
                                <div class="icon-btn" onclick="window.open('https://www.google.com/maps/search/${m.alamat}')"><img src="https://cdn-icons-png.flaticon.com/512/684/684908.png"><span>MAPS</span></div>
                                <div class="icon-btn" onclick="location.href='tel:${m.hp}'"><img src="https://cdn-icons-png.flaticon.com/512/724/724664.png"><span>TELP</span></div>
                                <div class="icon-btn" onclick="location.href='sms:${m.hp}'"><img src="https://cdn-icons-png.flaticon.com/512/724/724715.png"><span>SMS</span></div>
                                <div class="icon-btn" onclick="window.open('https://wa.me/62'+'${m.hp.substring(1)}')"><img src="https://cdn-icons-png.flaticon.com/512/733/733585.png"><span>WA</span></div>
                            </div>
                            <div class="member-buttons">
                                <button class="btn-wide" onclick="pilihFoto(${idx})">PILIH / GANTI FOTO</button>
                                <button class="btn-edit" onclick="openFormEdit(${idx})">EDIT</button>
                                <button class="btn-hapus" onclick="hapusMember(${idx})">HAPUS</button>
                                <button class="btn-kembali" onclick="showPage('pageBeranda')">KEMBALI</button>
                            </div>
                        </div>
                    `;
                    list.appendChild(card);
                }
            });
        }

        function pilihFoto(idx) {
            const key = membersKeys[idx];
            const inp = document.createElement("input"); inp.type="file"; inp.accept="image/*";
            inp.onchange = e => {
                const reader = new FileReader();
                reader.onload = f => { dbRef.child(key).update({ foto: f.target.result }); };
                reader.readAsDataURL(e.target.files[0]);
            };
            inp.click();
        }

        function hapusMember(idx) {
            const key = membersKeys[idx];
            customNotif("Hapus data member ini dari Awan selamanya?", 'confirm', (res) => {
                if(res) { dbRef.child(key).remove(); }
            });
        }

        function resetFoto() {
            customNotif("PILIH METODE HAPUS FOTO:\n1. Hapus SEMUA Foto Member\n2. Hapus Foto Berdasarkan NOMOR ID\n\nKetik angka 1 atau 2:", 'prompt', (pilihan) => {
                if (pilihan === "1") {
                    customNotif("PERINGATAN: Hapus SEMUA foto member di database?", 'confirm', (res) => {
                        if(res) {
                            membersKeys.forEach(key => dbRef.child(key).update({ foto: "" }));
                            customNotif("Semua foto berhasil dihapus!");
                        }
                    });
                } else if (pilihan === "2") {
                    customNotif("Masukkan Nomor ID Member yang fotonya ingin dihapus:", 'prompt', (idTarget) => {
                        if (idTarget) {
                            const memberDitemukan = members.findIndex(m => m.id == idTarget);
                            if (memberDitemukan !== -1) {
                                const key = membersKeys[memberDitemukan];
                                customNotif("Hapus foto untuk member ID: " + idTarget + " (" + members[memberDitemukan].nama + ")?", 'confirm', (res) => {
                                    if(res) {
                                        dbRef.child(key).update({ foto: "" });
                                        customNotif("Foto Member ID " + idTarget + " berhasil direset!");
                                    }
                                });
                            } else { customNotif("Maaf, Member dengan ID " + idTarget + " tidak ditemukan."); }
                        }
                    });
                }
            });
        }

        function exportCSV() {
            let csv = "ID,Nama,Jabatan,HP,TTL,Alamat,Kelurahan,Kecamatan,Kota,Provinsi,Negara,Agama,Pekerjaan,Hobby,Komitmen\n";
            members.forEach(m=> csv += `${m.id},${m.nama},${m.jabatan},${m.hp},${m.ttl},${m.alamat},${m.kel},${m.kec},${m.kota},${m.prov},${m.negara},${m.agama},${m.kerja},${m.hobby},${m.komitmen}\n`);
            const blob = new Blob([csv], {type:'text/csv'});
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href=url; a.download='data_member_nafas.csv'; a.click();
        }
    </script>
</body>
</html>
